{% from "partials/macros.html" import icon %}
<form class="search-row mb-3" method="get" role="search">
  <input type="hidden" name="view" value="{{ view }}">
  <div class="search-box">{{ icon("search") }}<input class="form-control" type="search" name="q" value="{{ q }}" placeholder="Search name, code, location or funder" aria-label="Search projects"></div>
  {% set active_filters = (1 if status != "open" else 0) + (["category", "dept", "priority", "mine", "delayed"]|select("in", request.args)|list|length) %}
  <button type="button" class="btn btn-soft filters-toggle" data-toggle-class="#more-filters" aria-controls="more-filters" aria-expanded="false">{{ icon("sliders-horizontal") }} Filters{% if active_filters %} <span class="chip purple">{{ active_filters }}</span>{% endif %}</button>
  <div class="filters-extra" id="more-filters">
  <select class="form-select" name="status" data-autosubmit aria-label="Status">
    <option value="open" {{ "selected" if status == "open" }}>Open projects</option>
    {% for v, l in statuses %}<option value="{{ v }}" {{ "selected" if status == v }}>{{ l }}</option>{% endfor %}
    <option value="closed" {{ "selected" if status == "closed" }}>Closed</option>
    <option value="all" {{ "selected" if status == "all" }}>All projects</option>
  </select>
  <select class="form-select" name="category" data-autosubmit aria-label="Category">
    <option value="">All categories</option>
    {% for c in categories %}<option value="{{ c.id }}" {{ "selected" if request.args.get("category")|int == c.id }}>{{ c.name }}</option>{% endfor %}
  </select>
  <select class="form-select" name="dept" data-autosubmit aria-label="Department">
    <option value="">All departments</option>
    {% for d in departments %}<option value="{{ d.id }}" {{ "selected" if request.args.get("dept")|int == d.id }}>{{ d.name }}</option>{% endfor %}
  </select>
  <select class="form-select" name="priority" data-autosubmit aria-label="Priority">
    <option value="">Any priority</option>
    {% for v, l in priorities %}<option value="{{ v }}" {{ "selected" if request.args.get("priority") == v }}>{{ l }}</option>{% endfor %}
  </select>
  <select class="form-select" name="sort" data-autosubmit aria-label="Sort">
    {% for v, l in [("updated", "Recently updated"), ("end", "Due date"), ("priority", "Priority"), ("name", "Name"), ("code", "Newest")] %}<option value="{{ v }}" {{ "selected" if sort == v }}>{{ l }}</option>{% endfor %}
  </select>
  <label class="form-check chip-toggle"><input class="form-check-input" type="checkbox" name="mine" value="1" data-autosubmit {{ "checked" if request.args.get("mine") == "1" }}> My projects</label>
  <label class="form-check chip-toggle"><input class="form-check-input" type="checkbox" name="delayed" value="1" data-autosubmit {{ "checked" if request.args.get("delayed") == "1" }}> Delayed only</label>
  </div>
</form>
